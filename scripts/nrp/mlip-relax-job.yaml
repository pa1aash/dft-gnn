# MACE-MP-0 relaxation of the mapped host unit cells (scripts/mlip_relax.py), one shard per indexed pod.
# Each pod installs MACE into its local disk (/tmp/venv; CephFS is too slow for a 5 GB install), torch pinned to
# the lock's version, then runs on the checkout at /workspace/dft-gnn. Resumable per shard.
apiVersion: batch/v1
kind: Job
metadata:
  name: dftgnn-mlip-relax
  labels: {app: dftgnn, role: mlip}
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimitPerIndex: 4
  maxFailedIndexes: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: dftgnn, role: mlip}
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-GeForce-RTX-3090, NVIDIA-A10, NVIDIA-L40, NVIDIA-L40S, NVIDIA-RTX-A6000,
                             NVIDIA-A40, NVIDIA-GeForce-RTX-4090, NVIDIA-TITAN-RTX, NVIDIA-L4, NVIDIA-RTX-A5000,
                             NVIDIA-A100-PCIE-40GB, NVIDIA-A100-80GB-PCIe, NVIDIA-A100-SXM4-80GB,
                             NVIDIA-GeForce-RTX-2080-Ti, NVIDIA-RTX-A4000]
                  - key: nvidia.com/cuda.driver.major
                    operator: Gt
                    values: ["579"]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [hcc-nrp-shor-c6017.unl.edu]
      containers:
        - name: relax
          image: python:3.11-bookworm
          workingDir: /workspace/dft-gnn
          command: ["bash", "-c"]
          args:
            - >-
              set -o pipefail &&
              python3.11 -m venv /tmp/venv && /tmp/venv/bin/python -m pip install -q --upgrade pip &&
              /tmp/venv/bin/python -m pip install -q -c /workspace/mlip-constraints.txt torch==2.13.0 mace-torch
              pymatgen ase numpy &&
              /tmp/venv/bin/python scripts/mlip_relax.py --shard $JOB_COMPLETION_INDEX --n-shards 4
              --device cuda --model medium --dtype float64 --fmax 0.01 --max-steps 500 2>&1
              | tee -a /workspace/mlip_relax_$JOB_COMPLETION_INDEX.log
          resources:
            requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1, ephemeral-storage: 20Gi}
            limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1, ephemeral-storage: 20Gi}
          volumeMounts:
            - {name: vol, mountPath: /workspace}
      volumes:
        - name: vol
          persistentVolumeClaim: {claimName: dftgnn-vol}
