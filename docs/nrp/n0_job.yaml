# N0 checkout Job (namespace cms-ml, project volume dftgnn-vol). Runs docs/nrp/n0_pod.sh on one GPU.
# Any GPU with compute capability >= 7.5 (the cu130 torch build) is accepted, so the Job starts on whatever is free;
# the node that raised CUDA illegal-address errors in the 2026-10-08 runs (hcc-nrp-shor-c6017.unl.edu) is excluded.
apiVersion: batch/v1
kind: Job
metadata:
  name: dftgnn-n0-checkout-2
  labels: {app: dftgnn, role: n0}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: dftgnn, role: n0}
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: nvidia.com/gpu.product, operator: Exists}
                  - {key: nvidia.com/gpu.product, operator: NotIn, values: [NVIDIA-GeForce-GTX-1080-Ti, NVIDIA-TITAN-Xp, Tesla-V100-SXM2-32GB, Tesla-V100-SXM2-16GB, Tesla-V100-PCIE-16GB, NVIDIA-A100-80GB-PCIe-MIG-1g.10gb]}
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [hcc-nrp-shor-c6017.unl.edu]}
      containers:
        - name: n0
          image: python:3.11-bookworm
          command: ["bash", "/workspace/n0/n0_pod.sh"]
          env:
            - {name: N0_SHA, value: e6d1a847a9e77c49e96a417bda9b19285fb1db7d}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1, ephemeral-storage: 20Gi}
            limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1, ephemeral-storage: 20Gi}
          volumeMounts:
            - {name: vol, mountPath: /workspace}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: vol
          persistentVolumeClaim: {claimName: dftgnn-vol}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 4Gi}
