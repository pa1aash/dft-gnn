claims:
  - id: B0
    statement: "A linear model in two descriptors (oxide stability and PBEsol+U band gap) with intercept provides the thermodynamic floor against which all learned models are measured."
    tested_by: M1
    figure: Fig2
    falsifiable_how: "Descriptive baseline; reported, not tested."
    status: measured
    result_ref: results/b0_physics_floor.json
  # C0: the Kiyohara-split half is measured (results/c0_official.json, S08: seed-ensemble MAE 0.283 eV, gate passed);
  # the formula-grouped-protocol half is measured in the sweep, so the status stays planned.
  # S10 (results/g1_primary.json): S at B = 654 on the formula-grouped protocol, seed-ensemble MAE 0.273 eV
  # [0.252, 0.300] against the published 0.29 eV (and 0.283 eV for the official C0 on Kiyohara's split).
  # A6 (results freeze, 2026-10-14; docs/freeze_notes.md): both halves are measured (Kiyohara split: results/c0_official.json,
  # gate passed; formula-grouped protocol: results/g1_primary.json per_budget.654.MAE_S), so the status moves from planned
  # to measured. The comments above are kept as written; no value or label changes. No v2 C0 on Kiyohara's split exists
  # as a named record; the v2 formula-grouped value is POST HOC (results/c1c2_v2.json mae.654.S).
  - id: C0
    statement: "A structure-only MEGNet on pristine host supercells with a marked vacancy site reproduces the published structure-only accuracy for neutral oxygen vacancies (0.29 eV; Kiyohara et al., Phys. Rev. Lett. 135, 246101, 2025), on both our formula-grouped protocol and Kiyohara's released host split."
    tested_by: M3
    figure: Fig2 reference line; SI parity
    falsifiable_how: "MAE on Kiyohara's split materially worse than 0.29 eV triggers debugging before any further claim."
    status: measured
    result_ref: results/c0_official.json
  # Collaborator NRP branch (merged 2026-10-11): results/c1c2_v1.json, same estimand and inputs as
  # results/g1_primary.json, identical point values (docs/ingest_report.md rows 4-7). POST HOC (v2):
  # results/c1c2_v2.json, A at 654 +0.015 [-0.008, +0.036], N* 654; LOCO A in both files.
  # EXTENSION (A1; docs/deviations.md rows of 2026-10-11 and 2026-10-14; docs/a1_notes.md). Extra records beside
  # the registered result_ref: results/precision_a_b400_b654.json (30 resamples x 5 seeds at B = 400 and 654, both
  # backbones; subsets 10 x 3, 10 x 5, 30 x 3) and results/cv_extended_budget.json (grouped K-fold CV at about 736
  # and 777 training hosts, extended-budget statement). Neither replaces results/g1_primary.json.
  - id: C1
    statement: "The MAE advantage of explicit DFT electronic descriptors over structure alone (D minus S) falls below delta = 0.05 eV, with the upper 95% bootstrap bound below delta at budget N* and all larger budgets; extends the descriptor-only learning curve of Kumagai et al. (2021) to the structure-versus-descriptor gap."
    tested_by: M5
    figure: Fig2, Fig3
    falsifiable_how: "If the upper bound never falls below delta within available data, N* is reported as a lower bound."
    status: measured
    result_ref: results/g1_primary.json
  # Collaborator NRP branch: C2 also in results/c1c2_v1.json (identical point value, -0.012) and, POST HOC (v2),
  # results/c1c2_v2.json (+0.015 [-0.008, +0.036]).
  # EXTENSION (A1): the C2 ceiling refined over 30 resamples x 5 seeds in results/precision_a_b400_b654.json
  # (v1.30x5.654.A, v2.30x5.654.A) and measured beyond 654 hosts in results/cv_extended_budget.json (v1.k10, v1.k20,
  # v2.k10, v2.k20); the registered C2 value stays results/g1_primary.json c2_ceiling.
  - id: C2
    statement: "At maximum training budget, the D minus S gap, with 95% CI, bounds the improvement perfect pristine-host electronic information can provide."
    tested_by: M5
    figure: Fig3
    falsifiable_how: "Measurement; reported with CI."
    status: measured
    result_ref: results/g1_primary.json
  # POST HOC (v2), collaborator NRP branch: results/c3a_v2.json (P1-v2 and P-v2, 183 each; TOST rule of
  # docs/deviations.md 2026-10-09). No v1 staging result exists; status stays planned (docs/ingest_gaps.md).
  # [Superseded by A2, comment kept as written: the v1 staging result now exists, see below.]
  # A2 (2026-10-14; docs/deviations.md row of 2026-10-14 §8, logged before any number; docs/a2_notes.md). REGISTERED
  # staging analysis on the originally registered backbone (v1): results/staging_v1.json (183 P, 183 P1; pairing of
  # 2026-10-10). Outcomes by the TOST rule of 2026-10-09, ratified 2026-10-11, POST HOC (it withdraws the null
  # sentence of falsifiable_how below): P worse than S at all six budgets, non-inferiority at none, D - P below zero
  # at every budget. The v2 staging (POST HOC) is row C3a-v2.
  - id: C3a
    statement: "A staged model P, which predicts the pristine-host electronic descriptors (host-level and pristine-site Bader) from structure and passes the predictions to the trained oracle D, is compared with end-to-end S and oracle D at matched budgets; the D-minus-P gap is the cost of predicting rather than knowing the descriptors."
    tested_by: M6
    figure: Fig4
    falsifiable_how: "P minus S indistinguishable from zero is reported as a null."
    status: measured
    result_ref: results/staging_v1.json
  # POST HOC (A2; docs/deviations.md row of 2026-10-14 §8; docs/a2_notes.md). v2 is the primary backbone and POST HOC,
  # never pre-registered; the TOST rule is POST HOC (ratified 2026-10-11). Point values reproduce results/c3a_v2.json
  # (collaborator) to 1e-16; the v2 true-descriptor swap-in check was not run (checkpoints on cluster storage only).
  - id: C3a-v2
    statement: "POST HOC. On the primary backbone (v2), the staged model P-v2 (P1-v2 then D-v2 of the same resample, budget and seed) is compared with S-v2 and D-v2 at the six budgets with the four-outcome TOST rule (delta_P = 0.05 eV): no budget has P better than S; P is worse at 50, 100 and 200 hosts, equivalent at 400, worse but within the equivalence margin at 654 and inconclusive at 25; the one-sided 95% upper bound on P minus S is below delta_P at 400 and 654 only; D minus P is below zero at 100 to 654 hosts."
    tested_by: "analysis/staging_analysis.py on analysis/staging_eval_table.py (tests: analysis/tests/test_staging.py); sanity: S minus D reproduces results/c1c2_v2.json, the staging points reproduce results/c3a_v2.json"
    figure: "Fig4 (figures/main/fig4_staging.pdf), solid series"
    falsifiable_how: "An outcome category or non-inferiority decision that differs from the record under the frozen rule, or a point value that differs from the stored predictions, refutes the row."
    status: measured
    result_ref: results/staging_v2.json
  # POST HOC (v2), collaborator NRP branch: results/mlip_eval_v2.json (S-v2, D-v2, P-v2 on 802 relaxed hosts,
  # results/mlip/). No v1 geometry evaluation exists; status stays planned (docs/ingest_gaps.md).
  # [Superseded by A3, comment kept as written (note added at the A6 freeze): the v1 geometry evaluation now exists,
