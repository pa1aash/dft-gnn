    result_ref: results/sens_cgcnn.json
  - id: A4-GEOM
    statement: "Of 818 hosts, 809 map onto the release supercell by translation and are relaxed with MACE-MP-0; 802 converge within 500 FIRE steps and are evaluated; no change in MAE of S, D or P at 200 or 654 training hosts on relaxed or rescaled cells exceeds 0.0033 eV in magnitude."
    tested_by: "collaborator's evaluation of the final network on his relaxations (paired hierarchical bootstrap); convergence flags of results/mlip/relaxed_shard*.json.gz"
    figure: "Table G1"
    falsifiable_how: "A change in MAE beyond 0.0033 eV, or a different count of converged relaxations, refutes the row."
    status: measured
    result_ref: results/mlip_eval_v2.json
  - id: A4-PROBE
    statement: "For the final network the linear probe recovers more descriptor variance as training hosts grow (Spearman 0.964 [0.949, 0.980] host-electronic, 0.978 [0.970, 0.987] site-electronic) and beats shuffled labels at every size from 200, but does not beat an untrained encoder for the host-electronic class at any size from 200, so the control condition fails for both classes."
    tested_by: "ridge probe of the readout input with grouped cross-validated penalty; resample bootstrap"
    figure: "Figure H1"
    falsifiable_how: "A host-electronic difference to the untrained encoder with an interval above zero at 200, 400 or 654 hosts refutes the row."
    status: measured
    result_ref: results/probe_descriptive.json
  - id: A4-PAIRS
    statement: "With 654 training hosts the structure-only network orders 3 of the 4 screened site pairs within a host as DFT does; the inverted pair, the two sites of ZrO2, has the smallest DFT difference (0.088 eV)."
    tested_by: "screening predictions averaged over the resamples that hold the host out"
    figure: "Table I2"
    falsifiable_how: "Pair differences that differed from the stored screening predictions refute the row."
    status: measured
    result_ref: figures/main/data/screening_demo.json
