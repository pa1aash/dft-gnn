  # equivalent (MLIP) and P better within the margin (rescaled).
  - id: C3b-nc
    statement: "Sensitivity of C3b (registered in the relaxation clarification of 2026-10-10): with the 7 hosts whose MACE-MP-0 relaxation did not converge removed from every test set, Delta-MAE at B = 654 is S +0.0041 eV [+0.0007, +0.0076] (MLIP) and +0.0079 eV [+0.0034, +0.0131] (rescaled), D and P intervals include 0; the null-rule outcome is unchanged (not met, neither condition holds; median internal RMSD 0.024 A over the 811 converged hosts)."
    tested_by: "analysis/geometry_analysis.py (item f of the 2026-10-14 A3 row; tests: analysis/tests/test_geometry.py)"
    figure: "none (docs/a3_notes.md table)"
    falsifiable_how: "A change of the null-rule outcome or of which Delta-MAE intervals exclude 0 when the non-converged hosts are removed would make the primary C3b outcome depend on them."
    status: measured
    result_ref: results/geometry_c3b.json
