claims:
  - id: B0
    statement: "A linear model in two descriptors (oxide stability and PBEsol+U band gap) with intercept provides the thermodynamic floor against which all learned models are measured."
    tested_by: M1
    figure: Fig2
    falsifiable_how: "Descriptive baseline; reported, not tested."
    status: measured
    result_ref: results/b0_physics_floor.json
  # C0: the Kiyohara-split half is measured (results/c0_official.json, S08: seed-ensemble MAE 0.283 eV, gate passed);
  # the formula-grouped-protocol half is measured in the sweep, so the status stays planned.
  # S10 (results/g1_primary.json): S at B = 654 on the formula-grouped protocol, seed-ensemble MAE 0.273 eV
  # [0.252, 0.300] against the published 0.29 eV (and 0.283 eV for the official C0 on Kiyohara's split).
  - id: C0
    statement: "A structure-only MEGNet on pristine host supercells with a marked vacancy site reproduces the published structure-only accuracy for neutral oxygen vacancies (0.29 eV; Kiyohara et al., Phys. Rev. Lett. 135, 246101, 2025), on both our formula-grouped protocol and Kiyohara's released host split."
    tested_by: M3
    figure: Fig2 reference line; SI parity
    falsifiable_how: "MAE on Kiyohara's split materially worse than 0.29 eV triggers debugging before any further claim."
    status: planned
    result_ref: results/c0_official.json
  # Collaborator NRP branch (merged 2026-10-11): results/c1c2_v1.json, same estimand and inputs as
  # results/g1_primary.json, identical point values (docs/ingest_report.md rows 4-7). POST HOC (v2):
  # results/c1c2_v2.json, A at 654 +0.015 [-0.008, +0.036], N* 654; LOCO A in both files.
  # EXTENSION (A1; docs/deviations.md rows of 2026-10-11 and 2026-10-14; docs/a1_notes.md). Extra records beside
  # the registered result_ref: results/precision_a_b400_b654.json (30 resamples x 5 seeds at B = 400 and 654, both
  # backbones; subsets 10 x 3, 10 x 5, 30 x 3) and results/cv_extended_budget.json (grouped K-fold CV at about 736
  # and 777 training hosts, extended-budget statement). Neither replaces results/g1_primary.json.
  - id: C1
    statement: "The MAE advantage of explicit DFT electronic descriptors over structure alone (D minus S) falls below delta = 0.05 eV, with the upper 95% bootstrap bound below delta at budget N* and all larger budgets; extends the descriptor-only learning curve of Kumagai et al. (2021) to the structure-versus-descriptor gap."
    tested_by: M5
    figure: Fig2, Fig3
    falsifiable_how: "If the upper bound never falls below delta within available data, N* is reported as a lower bound."
    status: measured
    result_ref: results/g1_primary.json
  # Collaborator NRP branch: C2 also in results/c1c2_v1.json (identical point value, -0.012) and, POST HOC (v2),
  # results/c1c2_v2.json (+0.015 [-0.008, +0.036]).
  # EXTENSION (A1): the C2 ceiling refined over 30 resamples x 5 seeds in results/precision_a_b400_b654.json
  # (v1.30x5.654.A, v2.30x5.654.A) and measured beyond 654 hosts in results/cv_extended_budget.json (v1.k10, v1.k20,
  # v2.k10, v2.k20); the registered C2 value stays results/g1_primary.json c2_ceiling.
  - id: C2
    statement: "At maximum training budget, the D minus S gap, with 95% CI, bounds the improvement perfect pristine-host electronic information can provide."
    tested_by: M5
    figure: Fig3
    falsifiable_how: "Measurement; reported with CI."
    status: measured
    result_ref: results/g1_primary.json
  # POST HOC (v2), collaborator NRP branch: results/c3a_v2.json (P1-v2 and P-v2, 183 each; TOST rule of
  # docs/deviations.md 2026-10-09). No v1 staging result exists; status stays planned (docs/ingest_gaps.md).
  - id: C3a
    statement: "A staged model P, which predicts the pristine-host electronic descriptors (host-level and pristine-site Bader) from structure and passes the predictions to the trained oracle D, is compared with end-to-end S and oracle D at matched budgets; the D-minus-P gap is the cost of predicting rather than knowing the descriptors."
    tested_by: M6
    figure: Fig4
    falsifiable_how: "P minus S indistinguishable from zero is reported as a null."
    status: planned
  # POST HOC (v2), collaborator NRP branch: results/mlip_eval_v2.json (S-v2, D-v2, P-v2 on 802 relaxed hosts,
  # results/mlip/). No v1 geometry evaluation exists; status stays planned (docs/ingest_gaps.md).
  - id: C3b
    statement: "Under MACE-MP-0 relaxed host geometry, staged and end-to-end models degrade differently; degradation is decomposed into volumetric strain and internal displacement."
    tested_by: M7
    figure: Fig5
    falsifiable_how: "Statistically indistinguishable degradation slopes, or negligible geometry change, are reported as a null."
    status: planned
  # POST HOC (v2), collaborator NRP branch: results/probe_v2_sweep.json (60 S-v2 checkpoints; fails the
  # untrained-encoder control). No v1 probe exists; status stays planned (docs/ingest_gaps.md).
  - id: C4
    statement: "Linear-probe recovery of electronic descriptors from the structure-only model's embeddings increases with training budget and exceeds shuffled-label and random-encoder controls."
    tested_by: M8
    figure: Fig6
    falsifiable_how: "Flat trend or failure to beat both controls moves C4 to SI."
    status: planned
  # Collaborator NRP branch: results/screening_c5.json; mae_S 0.294 eV from the pre-registered S at B = 654
  # (v1), mae_S_v2 0.420 eV POST HOC (v2). Status stays planned.
  - id: C5
    statement: "Screening demonstration on named oxide crystals."
    tested_by: M10
    figure: Fig7
    falsifiable_how: "Demonstration, not a claim."
    status: planned
  # EXTENSION (M9; docs/deviations.md row of 2026-10-11 "Within-host breakdown", logged before any number;
  # docs/within_host_physics.md). New analysis of existing B = 654 test predictions of both backbones; v2 columns
  # are POST HOC by backbone. All hosts: zero-skill 0.184 eV; within-host residual MAE S-v2 0.146, D-v2 0.146,
  # S-v1 0.138, D-v1 0.154 eV (739 hosts, 1561 sites; 463 hosts with >= 2 sites).
  - id: WH1
    statement: "EXTENSION. At B = 654, the within-host residual MAE of S and D on both backbones, broken down by d-electron class, cation element, PHS-prone cations, stability and band-gap terciles and vacancy-site Bader-charge rank, is reported against the zero-skill value of a predictor constant within each host, with host-cluster bootstrap intervals; descriptive, no hypothesis test."
    tested_by: "analysis/within_host_breakdown.py (tests: analysis/tests/test_within_host_breakdown.py; sanity checks against results/g1_primary.json, results/g1_within_host.json and results/c1c2_v2.json)"
    figure: "SI Fig. within-host groups (figures/si/fig_si_withinhost_groups.pdf)"
    falsifiable_how: "A model whose within-host residual MAE is not below the zero-skill value in a group has no within-host skill there; a mismatch of the pooled values with the G1 records (> 1e-3 eV) would invalidate the breakdown."
    status: measured
    result_ref: results/within_host_breakdown.json
  # EXTENSION (M8; docs/screening_demo.md). New numbers derived from the registered screening record
  # results/screening_c5.json (per-site means asserted equal to 1e-9): per-resample ranges, host-cluster MAE
  # intervals, within-host pair differences. v1 values PRE-REGISTERED by origin (provenance label #10), v2 values
  # POST HOC (#11). C5 itself stays planned. MAE v1 0.294 [0.195, 0.424] eV, v2 0.420 [0.307, 0.553] eV; 10 sites,
  # 7 hosts; 3 of 4 within-host pairs in the DFT order on both backbones.
  - id: SD1
    statement: "EXTENSION. Out-of-sample predictions of S at B = 654 for the 10 oxygen sites of the 7 named candidate oxides in universe v1 are set against the DFT value of the same site, on both backbones, with the per-resample range, a host-cluster bootstrap interval on the MAE and the within-host pair order; a demonstration, not a test of a hypothesis."
    tested_by: "figures/code/screening_data.py (record written via write_result; aggregation checked against results/screening_c5.json)"
    figure: "Fig7 (figures/main/fig7_screening.pdf); Tables screening_sites and screening_pairs"
    falsifiable_how: "Demonstration; per-site means that differed from results/screening_c5.json (> 1e-9 eV) would invalidate the record."
    status: measured
    result_ref: figures/main/data/screening_demo.json
  # POST HOC (docs/deviations.md, AUTHOR DECISION row of 2026-10-11; docs/provenance_labels.md, note on the v2
  # groups). Chronology unchanged: v2 was adopted after test-set diagnostics of v1; every v2 result keeps its
  # POST HOC label and v1 stays the originally registered backbone, reported in full.
  - id: V2P
    statement: "POST HOC. The v2 backbone (He initialisation; otherwise the registered MEGNet backbone) is the primary backbone of the manuscript by author decision (docs/deviations.md, AUTHOR DECISION row of 2026-10-11); v1 remains the originally registered backbone, is reported in full beside it, and v2 is never described as pre-registered."
    tested_by: "docs/deviations.md (AUTHOR DECISION row of 2026-10-11; v2 deviation rows of 2026-10-08 and 2026-10-09); docs/provenance_labels.md (groups #2, #5, #6, #7, #9, #11, #17, #18, #19)"
    figure: "Fig1 (pipeline, v2 solid and v1 dashed); Fig2, Fig3 (both backbones)"
    falsifiable_how: "Any v2 result reported without its POST HOC label, or any v1 result dropped or replaced, breaks this row; checked against docs/provenance_labels.md."
    status: measured
    result_ref: results/c1c2_v2.json
  # EXTENSION (A1; docs/deviations.md N4 row of 2026-10-11 and implementation row of 2026-10-14; docs/a1_notes.md).
  # v2 primary backbone, POST HOC; v1 originally registered backbone. Rule: the bound holds at 654 only if the pooled
  # 30 x 5 one-sided upper bound on A at B = 654 is below delta.
  - id: PR1
    statement: "EXTENSION. Over 30 outer resamples x 5 training seeds, the one-sided 95% upper bound on A = MAE_S - MAE_D at B = 654 is below delta = 0.05 eV for both backbones, so the non-inferiority bound holds at 654 under the precision rule; at B = 400 it is not below delta for either backbone. The 10 x 3, 10 x 5 and 30 x 3 subsets are reported beside the pooled set."
    tested_by: "analysis/precision_analysis.py on analysis/precision_cv_eval_table.py (tests: analysis/tests/test_precision_cv.py); sanity: the 10 x 3 subset reproduces results/g1_primary.json and results/c1c2_v2.json to 1e-6"
    figure: "Fig3 extended (figures/main/fig3_advantage_extended.pdf); SI Fig. GPU class (figures/si/fig_si_gpu_class.pdf)"
    falsifiable_how: "A pooled 30 x 5 upper bound at B = 654 at or above delta for a backbone refutes the statement for that backbone."
    status: measured
    result_ref: results/precision_a_b400_b654.json
  # EXTENSION (A1; docs/deviations.md N3 row of 2026-10-11 and implementation row of 2026-10-14; docs/a1_notes.md).
  # v2 primary backbone, POST HOC; v1 originally registered backbone.
  - id: CV1
    statement: "EXTENSION. With grouped K-fold CV (K = 10 and 20, about 736 and 777 training hosts, pooled out-of-fold predictions, host-cluster bootstrap), the one-sided 95% upper bound on A is below delta = 0.05 eV at B = 654 (registered G1 result), at about 736 and at about 777 training hosts for both backbones, so the extended-budget statement holds for v1 and for v2. It bounds the advantage below delta at these budgets; it does not show that the descriptors carry no information."
    tested_by: "analysis/cv_analysis.py on analysis/precision_cv_eval_table.py (tests: analysis/tests/test_precision_cv.py); fold partition of the 818 hosts asserted"
    figure: "Fig3 extended (figures/main/fig3_advantage_extended.pdf)"
    falsifiable_how: "An upper bound at or above delta at any of the three points names that point as failing and refutes the statement for that backbone."
    status: measured
    result_ref: results/cv_extended_budget.json
  # EXTENSION (A5; docs/deviations.md rows of 2026-10-10 §12 and 2026-10-14 §5, §12; docs/a5_notes.md). Originally
  # registered backbone (v1) only: the moment stage has no v2 runs (specs/moment.manifest.json).
  - id: SENS1
    statement: "EXTENSION. Removing the 10 entries with |defect moment| > 0.5 muB from training and test sites (v1, B = 654, 10 resamples x 3 seeds) changes A on the common test sites from -0.010 to -0.015 eV (paired change -0.005 eV, two-sided 95% interval [-0.025, +0.013]); the one-sided 95% upper bound on A stays below delta = 0.05 eV (+0.012 primary, +0.002 high moment), so the non-inferiority statement at 654 for v1 does not change. No v2 high-moment runs exist."
    tested_by: "analysis/sensitivity_analysis.py on analysis/sensitivity_eval_tables.py (tests: analysis/tests/test_sensitivity.py); G1 hierarchical bootstrap with the G1 draws; primary side reproduces results/g1_primary.json at B = 654 exactly"
    figure: "SI Fig. sensitivities, panel a (figures/si/fig_si_sensitivities.pdf)"
    falsifiable_how: "A one-sided upper bound on the high-moment A at or above delta would change the non-inferiority statement at 654 for v1."
    status: measured
    result_ref: results/sens_high_moment_v1.json
  # EXTENSION, untuned CGCNN (A5; docs/deviations.md rows of 2026-10-10 §12 and 2026-10-14 §5, §12). Descriptive,
  # one resample, no hypothesis test.
  - id: SENS2
    statement: "EXTENSION, untuned, descriptive. On outer resample 0 (seeds 0-2), CGCNN with fixed optimiser settings gives an advantage A = MAE_S - MAE_D of +0.125, +0.027 and +0.003 eV at B = 50, 200 and 654, against +0.241, +0.099 and -0.014 eV for the originally registered MEGNet backbone (v1) and +0.232, +0.036 and +0.031 eV for the primary backbone (v2); in both architectures A shrinks toward zero as the training budget grows. One resample only: the intervals reflect test-host sampling, not resample variation, and no test is made."
    tested_by: "analysis/sensitivity_analysis.py on analysis/sensitivity_eval_tables.py (tests: analysis/tests/test_sensitivity.py); host-cluster bootstrap over the 164 test hosts of resample 0, shared by every series"
    figure: "SI Fig. sensitivities, panel b (figures/si/fig_si_sensitivities.pdf)"
    falsifiable_how: "Descriptive cross-check; an A of CGCNN at B = 654 whose host-cluster interval excluded the MEGNet values on the same draws would contradict the shared trend."
    status: measured
    result_ref: results/sens_cgcnn.json
  # POST HOC (A5; docs/deviations.md rows of 2026-10-08 §5, 2026-10-10 §5 and 2026-10-14 §5, §12). Originally
  # registered backbone (v1) only; primary result and N* unchanged by rule.
  - id: SENS3
    statement: "POST HOC. Replacing every capped original by its 600-epoch twin (36 runs; at B = 400 five S runs, at B = 654 eight S and two D runs) changes A (v1) from +0.040 to +0.042 eV at B = 400 and from -0.012 to -0.008 eV at B = 654 (paired change +0.003 eV, two-sided 95% interval [-0.002, +0.010]); the one-sided 95% upper bound at 654 stays below delta (+0.009 primary, +0.014 twins), so the non-inferiority statement at 654 for v1 does not change, and at 400 it stays above delta. The primary result and N* are unchanged. v2 has no capped twins."
    tested_by: "analysis/sensitivity_analysis.py on analysis/sensitivity_eval_tables.py (tests: analysis/tests/test_sensitivity.py); G1 hierarchical bootstrap with the G1 draws; primary side reproduces results/g1_primary.json at B = 400 and 654 exactly"
    figure: "SI Fig. sensitivities, panel a (figures/si/fig_si_sensitivities.pdf)"
    falsifiable_how: "A twin-version one-sided upper bound at B = 654 at or above delta would make the 654 statement cap-sensitive for v1."
    status: measured
    result_ref: results/sens_capped_post_hoc.json
